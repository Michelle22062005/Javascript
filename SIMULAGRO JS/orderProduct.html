<!DOCTYPE html>
<html lang="en">
<!--
  Página principal de usuario para ver órdenes recientes y detalles de cuenta.
  Usa Bootstrap 5 y un CSS propio.
-->

<head>
    <!-- Configuración básica -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
          crossorigin="anonymous">

    <!-- CSS propio -->
    <link rel="stylesheet" href="./styles.css">

    <title>Document</title>
</head>

<body style="background-color: #eee;">
    <!-- ================= HEADER ================= -->
    <header class="header-menu">
        <nav class="navbar">
            <!-- Logo y nombre de la app -->
            <div class="d-flex">
                <img src="./assets/image/icons8-restaurant-50.png" alt="logo" width="25px" height="25px">
                <h2 class="navbar-brand">RestorApp</h2>
            </div>
            <!-- Botón de logout -->
            <div>
                <a href="./index.html" class="btn">
                    <img src="./assets/image/logOut.png" alt="log Out"> Log Out
                </a>
            </div>
        </nav>
    </header>

    <!-- ================= MAIN ================= -->
    <main class="container-fluid mt-4 mb-2">
        <div class="row g-4">

            <!-- ===== SECCIÓN ORDENES RECIENTES ===== -->
            <section class="col-12 col-lg-7 mt-4">
                <!-- Título y enlace "View All" -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="mb-0">Recent Orders</h2>
                    <p class="card-text">View All</p>
                </div>

                <!-- Contenedor de órdenes -->
                <div class="card mb-3" id="ordersContainer">
                    <div class="card-body">
                        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                            
                            <!-- Info del pedido -->
                            <div class="d-flex align-items-center gap-3">
                                <img src="./assets/image/icons8-cancel-50.png" alt="frying" width="30ox" height="30px">
                                <div>
                                    <h5>#ORD-4991</h5>
                                    <p>Oct 10, 2023 - 4 Items</p>
                                </div>
                            </div>

                            <!-- Acciones de la orden (precio y botón) -->
                            <div class="text-md-end">
                                <div class="d-flex justify-content-md-end align-items-center gap-3 mb-2">
                                    <h5 class="price"></h5>
                                    <button class="btn btn-outline-danger"></button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </section>

            <!-- ===== SECCIÓN DETALLES DE CUENTA ===== -->
            <section class="col-12 col-lg-4">
                <h2 class="mb-3">Account Details</h2>
                <div class="card h-100">

                    <!-- Encabezado del usuario -->
                    <div class="card-body text-center border-bottom">
                        <img src="./assets/image/icons8-user-100.png" alt="user" width="100px" height="100px">
                        <h4 id="nameUser" class="mb-1"></h4>
                        <p id="email" class="text-muted mb-2"></p>
                        <span class="badge bg-secondary">Customer</span>
                    </div>

                    <!-- Estadísticas del usuario -->
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-6">
                                <div class="border rounded p-3 text-center h-100">
                                    <p class="text-muted mb-1 small">TOTAL ORDERS</p>
                                    <h4 class="mb-0">12</h4>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="border rounded p-3 text-center h-100">
                                    <p class="text-muted mb-1 small">LOYALTY PTS</p>
                                    <h4 class="mb-0" style="color: rgb(35, 224, 66);">450</h4>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Opciones de cuenta -->
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-12">
                                <div class="border rounded d-flex justify-content-between p-3 h-100">
                                    <div class="d-flex gap-2">
                                        <img src="./assets/image/icons8-payment-50.png" alt="payment" width="40px" height="40px">
                                        <h4 class="mb-0">Payment Methods</h4>
                                    </div>
                                    <img src="./assets/image/icons8-greater-than-50.png" alt="greater" width="30px" height="30px">
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="border rounded d-flex justify-content-between p-3 h-100">
                                    <div class="d-flex gap-2">
                                        <img src="./assets/image/icons8-payment-50.png" alt="payment" width="40px" height="40px">
                                        <h4 class="mb-0">Preferences</h4>
                                    </div>
                                    <img src="./assets/image/icons8-greater-than-50.png" alt="greater" width="30px" height="30px">
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="border rounded d-flex justify-content-between p-3 h-100">
                                    <div class="d-flex gap-2">
                                        <img src="./assets/image/icons8-payment-50.png" alt="payment" width="40px" height="40px">
                                        <h4 class="mb-0">Payment Methods</h4>
                                    </div>
                                    <img src="./assets/image/icons8-greater-than-50.png" alt="greater" width="30px" height="30px">
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

        </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Script principal de lógica de órdenes -->
    <script type="module" src="./js/orderProduct.js"></script>

</body>
</html>
