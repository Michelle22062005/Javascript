<!doctype html>
<html lang="en">
<!--
  Página de Login para RestorApp.
  Permite al usuario iniciar sesión con nombre, email, rol y contraseña.
-->

<head>
    <!-- Configuración de codificación y responsive -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <!-- CSS propio -->
    <link rel="stylesheet" href="./styles.css">

    <!-- Bootstrap CSS desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body style="background-color: #eee;">
    <!-- ================= MAIN ================= -->
    <main>
        <!-- Sección del formulario centrado -->
        <section class="form-control w-50 m-auto mt-5 p-5 justify-content-center align-items-center" 
                 style="background-color: #fff;">
            
            <!-- Logo y título -->
            <div class="container-title">
                <img src="./assets/image/icons8-restaurant-80.png" alt="logo" width="50px" height="50px">
                <h1>RestorApp</h1>
                <p>Login to your account</p>
            </div>
            
            <!-- ================= FORMULARIO ================= -->
            <form id="loginForm" class="colunm g-5">

                <!-- Campo de Nombre -->
                <div class="col-auto mb-4">
                    <label for="name" class="visually">Ful Name</label>
                    <input 
                        type="text"  
                        class="form-control" 
                        id="name" 
                        placeholder="Enter your name" 
                        required>
                </div>

                <!-- Campo de Email -->
                <div class="col-auto mb-4">
                    <label for="email" class="visually">Email Address</label>
                    <input 
                        type="email"  
                        class="form-control" 
                        id="email" 
                        placeholder="Enter your email">
                </div>

                <!-- Selección de rol (usuario o admin) -->
                <div class="col-auto mb-4">
                    <label for="">Select Role</label>
                    <select role="button" class="form-control" id="roles" aria-label="Default select example">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <!-- Campo de contraseña -->
                <div class="col-auto mb-4">
                    <label class="visually">Password</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="passwordLogin" 
                        placeholder="Enter your password" 
                        required>
                </div>

                <!-- Div para mostrar mensajes de error o validación -->
                <div id="lmessage"></div>

                <!-- Botón de login -->
                <div class="col-auto">
                    <button 
                        type="submit" 
                        readonly 
                        class="form-control mb-3" 
                        style="background-color: rgb(61, 224, 46);">
                        Sign in
                    </button>
                </div>

                <!-- Link para registrarse si no tiene cuenta -->
                <p>Don't have an account? 
                    <a href="./register.html" style="text-decoration: none; color: #000;">Sign up</a>
                </p>
            </form>
        </section>
    </main>

    <!-- ================= SCRIPTS ================= -->
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Script propio (módulo JS) para manejar login -->
    <script type="module" src="./js/index.js"></script>
</body>

</html>
