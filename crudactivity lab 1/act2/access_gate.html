<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Access Gate</title>
</head>
<body>
   
    <section class="container d-grid justify-content-center align-items-center min-vh-100 ">
        <form action="  " method="post" id="check-in-form" class="border rounded p-4 d-flex flex-column gap-3 w-100" style="max-width: 420px;">
            <h1>Access Gate</h1>
            <label for="name">Enter your full name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            <label for="age">Enter your age:</label>
                <input type="number" id="age" name="age" required placeholder="Enter your age">
            <label for="role">Enter your role (coder/tutor/visitor):</label>
                <input type="text" id="role" name="role" required>
            <label for="acceptRules">Do you accept the lab rules (yes/no)?
                <input  type="checkbox" id="acceptRules" name="acceptRules" required>
            </label>
            <label for="hoursAvailable">Enter your hour disponibility (number between 1 and 12):</label>
            <input type="number" id="hoursAvailable" name="hoursAvailable" required>
            <input class="btn btn-primary" type="submit" value="Submit">
        </form>
    </section>
    <section class="section">

    </section>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="check_in.js"></script>
  </body>
    
</body>
</html>
